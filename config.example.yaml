# 小火龙工具箱后端配置模板
# 复制为 config.yaml 后填入真实值；含敏感信息，严禁提交到仓库。

server:
  # HTTP 监听端口
  port: 8080
  # 运行模式 debug / release
  mode: debug
  # 后台管理入口路径前缀（随机字符串，防止根路径暴露后台；如 "/ef16e15c12bb"）
  # 必须与前端 xhl-admin/.env.production 的 VITE_ADMIN_PATH 完全一致；置空则后台回到根路径
  admin_path: ""

database:
  host: 127.0.0.1
  port: 3306
  user: root
  password: "CHANGE_ME"
  dbname: hlong
  charset: utf8mb4
  max_open_conns: 50
  max_idle_conns: 10

redis:
  host: 127.0.0.1
  port: 6379
  password: "CHANGE_ME"
  db: 0

jwt:
  # 签名密钥（生产环境务必更换为随机值）
  secret: "CHANGE_ME"
  # 后台管理员 token 过期时间（小时）
  expire_hours: 72
  # 用户 token 过期时间（小时），720 = 30 天
  user_expire_hours: 720

security:
  # 每账号每分钟允许登录次数（防撞库）
  login_rate_limit_per_min: 20
  # 图形验证码有效期（秒）
  captcha_expire_seconds: 300
  # 客户端登录参数签名盐（与客户端保持一致，务必修改）
  client_sign_salt: "CHANGE_ME"
  # 客户端登录密码 AES 密钥（必须 16 字节，与客户端保持一致，务必修改）
  client_aes_key: "CHANGE_ME"
  # qrlogin 账号 data 加密 AES 密钥（必须 16 字节，前端加密用，务必修改）
  qrlogin_aes_key: "CHANGE_ME"
  # 各接口每日调用每 N 次触发一次滑动拼图验证码（key=接口名，0=不触发）
  captcha_step:
    qrlogin: 20

cost:
  # 开放平台每次扫码确认扣费积分（调用即扣；0=不扣）
  open_qrlogin_cost: 20
  # fdev 出包（/api/open/fdev/issue）每次扣费积分（调用即扣；0=不扣）；解密 /open 不扣费
  fdev_issue_cost: 1

upload:
  # 上传根目录（相对或绝对路径）
  dir: uploads
  # 静态资源对外访问基础地址（容器部署可留空 → 返回 /uploads 相对路径）
  base_url: ""

log:
  # 调用记录（call_log，每次调用一行）保留天数：缺省/0 = 90 天，保留期内每 24 小时自动清一次；
  # 填一个很大的数（如 36500）等于不清理。
  # 扣费账本 billing_log 不受这里影响，永不自动删除（钱相关流水，且行数远小于调用记录）。
  retain_days: 90

super_admin:
  username: "CHANGE_ME"
  password: "CHANGE_ME"
  nickname: "超级管理员"
